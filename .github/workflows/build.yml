name: Build Chess of Evil

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller pillow certifi
      - name: Build .exe
        run: |
          pyinstaller --onefile --windowed --name "Chess_of_Evil" --add-data "assets;assets" --icon "assets/icon.ico" --collect-all certifi --runtime-tmpdir "." main.py
      - uses: actions/upload-artifact@v4
        with:
          name: Chess_of_Evil_Windows
          path: dist/Chess_of_Evil.exe
          retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libfreetype6-dev libportmidi-dev
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller certifi
      - name: Build Linux binary
        run: |
          pyinstaller --onefile --windowed --name "Chess_of_Evil_Linux" --add-data "assets:assets" --collect-all certifi main.py
      - uses: actions/upload-artifact@v4
        with:
          name: Chess_of_Evil_Linux
          path: dist/Chess_of_Evil_Linux
          retention-days: 30

  release:
    needs: [ build-windows, build-linux ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release/
          merge-multiple: true

      - name: List files
        run: ls -la release/

      - name: Publish release via Python script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request, urllib.error

          token = os.environ["GITHUB_TOKEN"]
          repo  = os.environ["GITHUB_REPOSITORY"]
          tag   = os.environ["TAG_NAME"]
          api   = f"https://api.github.com/repos/{repo}"

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          def api_req(method, url, data=None):
              body = json.dumps(data).encode() if data else None
              req = urllib.request.Request(url, data=body, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req) as r:
                      return json.loads(r.read()), r.status
              except urllib.error.HTTPError as e:
                  return json.loads(e.read()), e.code

          # Delete existing release if present
          resp, status = api_req("GET", f"{api}/releases/tags/{tag}")
          if status == 200:
              release_id = resp["id"]
              print(f"Deleting existing release {release_id}...")
              api_req("DELETE", f"{api}/releases/{release_id}")
              import time; time.sleep(3)

          # Create new release
          body_text = f"""## Шахматы Зла / Chess of Evil {tag}

          ### Скачать / Download
          - **Windows**: `Chess_of_Evil.exe`
          - **Linux**: `Chess_of_Evil_Linux`
          - **Source**: `main.py`"""

          resp, status = api_req("POST", f"{api}/releases", {
              "tag_name": tag,
              "name": f"Chess of Evil {tag}",
              "body": body_text,
              "draft": False,
              "prerelease": False,
              "make_latest": "true",
          })
          assert status == 201, f"Failed to create release: {status} {resp}"
          upload_url = resp["upload_url"].split("{")[0]
          print(f"Created release {resp['id']}, upload_url: {upload_url}")

          # Upload files
          files = [
              ("release/Chess_of_Evil.exe",   "Chess_of_Evil.exe",   "application/octet-stream"),
              ("release/Chess_of_Evil_Linux",  "Chess_of_Evil_Linux", "application/octet-stream"),
              ("main.py",                      "main.py",             "text/x-python"),
          ]
          for path, name, mime in files:
              if not os.path.exists(path):
                  print(f"  SKIP {name} (not found)")
                  continue
              with open(path, "rb") as f:
                  data = f.read()
              up_headers = dict(headers)
              up_headers["Content-Type"] = mime
              up_req = urllib.request.Request(
                  f"{upload_url}?name={name}",
                  data=data, headers=up_headers, method="POST"
              )
              try:
                  with urllib.request.urlopen(up_req) as r:
                      print(f"  OK {name} ({len(data)//1024} KB)")
              except Exception as e:
                  print(f"  WARN {name}: {e}")

          print("Done!")
          PYEOF
