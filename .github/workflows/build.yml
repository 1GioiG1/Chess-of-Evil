name: Build Chess of Evil

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller pillow certifi
      - name: Build .exe
        run: |
          pyinstaller --onefile --windowed --name "Chess_of_Evil" --add-data "assets;assets" --icon "assets/icon.ico" --collect-all certifi main.py
      - uses: actions/upload-artifact@v4
        with:
          name: Chess_of_Evil_Windows
          path: dist/Chess_of_Evil.exe
          retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libfreetype6-dev libportmidi-dev
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller certifi
      - name: Build Linux binary
        run: |
          pyinstaller --onefile --windowed --name "Chess_of_Evil_Linux" --add-data "assets:assets" --collect-all certifi main.py
      - uses: actions/upload-artifact@v4
        with:
          name: Chess_of_Evil_Linux
          path: dist/Chess_of_Evil_Linux
          retention-days: 30

  release:
    needs: [ build-windows, build-linux ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release/
          merge-multiple: true

      - name: Delete old release and tag if exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          # Try to delete release (ignore error if not exists)
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          # Small wait to let GitHub process deletion
          sleep 3

      - name: Create new release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          TITLE="Chess of Evil $TAG"
          NOTES="## Шахматы Зла / Chess of Evil $TAG

          ### Скачать / Download
          - **Windows**: \`Chess_of_Evil.exe\`
          - **Linux**: \`Chess_of_Evil_Linux\`
          - **Source**: \`main.py\`"

          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --latest \
            release/Chess_of_Evil.exe \
            release/Chess_of_Evil_Linux \
            main.py
