name: Build Chess of Evil

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller pillow
      - name: Build .exe
        run: |
          pyinstaller --onefile --windowed --name "Chess_of_Evil" --add-data "assets;assets" --icon "assets/icon.ico" main.py
      - uses: actions/upload-artifact@v4
        with:
          name: Chess_of_Evil_Windows
          path: dist/Chess_of_Evil.exe
          retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libfreetype6-dev libportmidi-dev
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller
      - name: Build Linux binary
        run: |
          pyinstaller --onefile --windowed --name "Chess_of_Evil_Linux" --add-data "assets:assets" main.py
      - uses: actions/upload-artifact@v4
        with:
          name: Chess_of_Evil_Linux
          path: dist/Chess_of_Evil_Linux
          retention-days: 30

  release:
    needs: [ build-windows, build-linux ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release/
          merge-multiple: true

      - name: Publish Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: "Chess of Evil ${{ github.ref_name }}"
          allowUpdates: true
          removeArtifacts: false
          replacesArtifacts: true
          artifacts: "release/Chess_of_Evil.exe,release/Chess_of_Evil_Linux,main.py"
          body: |
            ## Шахматы Зла / Chess of Evil ${{ github.ref_name }}

            ### Скачать / Download
            - **Windows**: `Chess_of_Evil.exe`
            - **Linux**: `Chess_of_Evil_Linux`
            - **Исходный код / Source**: `main.py`
